name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar projeto Capacitor
        run: |
          mkdir -p www
          cp ./*.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Control Music" com.teusinhd625.controlmusic --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Aplicar icone do app
        run: |
          ICON=$(ls ./*.png 2>/dev/null | head -n 1)
          if [ -z "$ICON" ]; then
            echo "Nenhum arquivo .png encontrado na raiz do repositorio"
            ls -la
            exit 1
          fi
          echo "Usando icone: $ICON"
          CONVERT=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p $RES/mipmap-$name
            $CONVERT "$ICON" -resize ${size}x${size} $RES/mipmap-$name/ic_launcher.png
            $CONVERT "$ICON" -resize ${size}x${size} $RES/mipmap-$name/ic_launcher_round.png
            $CONVERT "$ICON" -resize ${size}x${size} $RES/mipmap-$name/ic_launcher_foreground.png
          done

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Control-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
